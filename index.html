
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BarkerBox | Get 15% Off</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <h1>BarkerBox</h1>

        <h2>Get 15% Off Your First Box!</h2>

        <p class="description">
            Treat your furry friend to a monthly surprise!
            BarkerBox delivers unique, playful, and durable toys
            that your dog will love. Subscribe today and enjoy
            exciting new toys every month while saving 15%
            on your first box!
        </p>

        <!-- Registration form -->
        <form>

            <!-- Name input field -->
            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >

            <!-- Email input field -->
            <label for="email">Email address:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Your email address"
                required
            >

            <button type="submit">
                Get My 15% Off
            </button>

        </form>

        <p class="footer-text">
            Join the BarkerBox family today!
        </p>

    </div>

</body>
</html>
